<title>Music Ludens 개인정보처리방침 · Privacy Policies</title>
<style>
  :root { --bg:#fbf8f3; --fg:#22190f; --muted:#6b5d4d; --line:#e6ddd0; --accent:#b8741a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0905; --fg:#f1e7da; --muted:#a8998a; --line:#2a2017; --accent:#e8a64a; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.7 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 24px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  a { display:flex; justify-content:space-between; padding:16px 4px; color:var(--fg); text-decoration:none; }
  a:hover span:first-child { color:var(--accent); }
  .sub { color:var(--muted); font-size:14px; }
</style>
</head>

<main>
  <h1>Music Ludens</h1>
